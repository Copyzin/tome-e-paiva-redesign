<!DOCTYPE html>
<html lang="pt-BR" data-screen-label="Especialidades">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Especialidades · Tomé &amp; Paiva</title>
<meta name="description" content="Cinco áreas de atuação: Direito do Trabalho, Previdenciário, Famílias e Sucessões, Civil e do Consumidor." />
<link rel="icon" type="image/png" href="../../assets/logo-tome-paiva-gold.png" />
<link rel="stylesheet" href="../../colors_and_type.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Button.jsx"></script>
<script type="text/babel" src="Navbar.jsx"></script>
<script type="text/babel" src="SpecialtyData.jsx"></script>
<script type="text/babel" src="Specialties.jsx"></script>
<script type="text/babel" src="SpecialtyDetail.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
function SpecHero() {
  return (
    <section className="tp-spec-hero">
      <div className="tp-container">
        <nav className="tp-spec-hero__breadcrumb" aria-label="breadcrumb">
          <a href="index.html">Início</a>
          <span>·</span>
          <span className="tp-current">Especialidades</span>
        </nav>
        <h1>Cinco frentes do Direito. Uma <em>conduta</em>.</h1>
        <p>
          Atuação consultiva e contenciosa em demandas estratégicas. Selecione
          a área para conhecer escopo, teses recorrentes e equipe responsável.
        </p>
      </div>
    </section>
  );
}

function SpecList() {
  return (
    <section className="tp-section" style={{paddingTop: 'var(--space-7)'}}>
      <div className="tp-container">
        {SPECIALTIES.map(s => <SpecialtyDetail key={s.id} spec={s} />)}
      </div>
    </section>
  );
}

function App() {
  return (
    <React.Fragment>
      <Navbar active="especialidades" />
      <SpecHero />
      <SpecList />
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
