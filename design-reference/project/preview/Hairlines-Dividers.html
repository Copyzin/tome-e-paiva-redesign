<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Hairlines & Dividers</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Hairlines · 1px</div>
  <div style="display:flex;flex-direction:column;gap:18px">
    <div>
      <div style="font-size:11px;color:#9A958C;letter-spacing:0.04em;margin-bottom:6px;font-family:ui-monospace,monospace">rgba(169, 121, 64, 0.18) — divisor padrão</div>
      <div style="height:1px;background:rgba(169,121,64,0.18)"></div>
    </div>
    <div>
      <div style="font-size:11px;color:#9A958C;letter-spacing:0.04em;margin-bottom:6px;font-family:ui-monospace,monospace">rgba(169, 121, 64, 0.32) — borda card hover</div>
      <div style="height:1px;background:rgba(169,121,64,0.32)"></div>
    </div>
    <div>
      <div style="font-size:11px;color:#9A958C;letter-spacing:0.04em;margin-bottom:6px;font-family:ui-monospace,monospace">gold gradient — separador decorativo</div>
      <div style="height:1px;background:linear-gradient(-45deg,#A97940,#C39150 50%,#E2C078);opacity:0.75"></div>
    </div>
    <div>
      <div style="font-size:11px;color:#9A958C;letter-spacing:0.04em;margin-bottom:6px;font-family:ui-monospace,monospace">linha vertical decorativa (citações, headlines)</div>
      <div style="display:flex;align-items:center;gap:14px"><div style="width:2px;height:32px;background:linear-gradient(180deg,#A97940,#E2C078)"></div><div style="font-family:'Cormorant Garamond';font-style:italic;font-size:18px;color:#D8D2C8">Detalhe editorial</div></div>
    </div>
  </div>
</div></body></html>
