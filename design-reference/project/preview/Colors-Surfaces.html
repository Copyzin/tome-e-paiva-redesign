<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Colors — Surfaces</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Superfícies · Dark scale</div>
  <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px">
    <div class="swatch"><div class="chip" style="background:#090909"></div><div class="name">Lowest</div><div class="hex">#090909</div></div>
    <div class="swatch"><div class="chip" style="background:#0B0B0B"></div><div class="name">Dim</div><div class="hex">#0B0B0B</div></div>
    <div class="swatch"><div class="chip" style="background:#111111"></div><div class="name">Base</div><div class="hex">#111111</div></div>
    <div class="swatch"><div class="chip" style="background:#151515"></div><div class="name">Low</div><div class="hex">#151515</div></div>
    <div class="swatch"><div class="chip" style="background:#1C1C1C"></div><div class="name">Default</div><div class="hex">#1C1C1C</div></div>
    <div class="swatch"><div class="chip" style="background:#252525"></div><div class="name">High</div><div class="hex">#252525</div></div>
    <div class="swatch"><div class="chip" style="background:#2A2A2A"></div><div class="name">Bright</div><div class="hex">#2A2A2A</div></div>
    <div class="swatch"><div class="chip" style="background:#303030"></div><div class="name">Highest</div><div class="hex">#303030</div></div>
  </div>
  <div class="dim" style="font-size:11.5px;line-height:18px">Profundidade vem de camadas tonais e bordas — não de sombras pesadas. Use Base (#111) como fundo de página; cards em Low/Default.</div>
</div></body></html>
