<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Colors — Text & Neutrals</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Textos · Grafite · Off-white</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
    <div class="swatch"><div class="chip" style="background:#F2F0EC"></div><div class="name">Off-white</div><div class="hex">#F2F0EC</div></div>
    <div class="swatch"><div class="chip" style="background:#D8D2C8"></div><div class="name">Variant</div><div class="hex">#D8D2C8</div></div>
    <div class="swatch"><div class="chip" style="background:#9A958C"></div><div class="name">Muted</div><div class="hex">#9A958C</div></div>
    <div class="swatch"><div class="chip" style="background:#5B5B5F"></div><div class="name">Grafite</div><div class="hex">#5B5B5F</div></div>
    <div class="swatch"><div class="chip" style="background:#3E3E42"></div><div class="name">Grafite dark</div><div class="hex">#3E3E42</div></div>
  </div>
  <div class="dim" style="font-size:11.5px;line-height:18px">Off-white (#F2F0EC) é o branco da marca — nunca usar #FFF puro em textos. Grafite jurídico para textos auxiliares e divisórias.</div>
</div></body></html>
