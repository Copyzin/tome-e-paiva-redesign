<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Colors — Brand Gold</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Marca · Ouro Bronze</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
    <div class="swatch"><div class="chip" style="background:#7C5730"></div><div class="name">Container</div><div class="hex">#7C5730</div></div>
    <div class="swatch"><div class="chip" style="background:#A97940;border-color:rgba(255,255,255,0.06)"></div><div class="name">Primary</div><div class="hex">#A97940</div></div>
    <div class="swatch"><div class="chip" style="background:#C39150"></div><div class="name">Bright</div><div class="hex">#C39150</div></div>
    <div class="swatch"><div class="chip" style="background:#E2C078"></div><div class="name">Light</div><div class="hex">#E2C078</div></div>
    <div class="swatch"><div class="chip" style="background:#F6E4C6"></div><div class="name">On-container</div><div class="hex">#F6E4C6</div></div>
  </div>
  <div class="dim" style="font-size:11.5px;line-height:18px">Ouro é acento, nunca dominante. Aplicar em botões primários, linhas finas, ícones, hover states e pontos de atenção.</div>
</div></body></html>
