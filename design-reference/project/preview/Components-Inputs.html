<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Components — Inputs</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Inputs · Texto</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <label style="font-family:'Montserrat';font-weight:500;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:#9A958C">Nome completo</label>
      <input type="text" placeholder="Digite seu nome" style="font-family:'Montserrat';font-weight:400;font-size:14px;color:#F2F0EC;background:#151515;border:1px solid rgba(169,121,64,0.24);padding:12px 14px;border-radius:4px;outline:none"/>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label style="font-family:'Montserrat';font-weight:500;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:#A97940">E-mail (focado)</label>
      <input type="email" value="contato@" style="font-family:'Montserrat';font-weight:400;font-size:14px;color:#F2F0EC;background:#151515;border:1px solid #A97940;padding:12px 14px;border-radius:4px;outline:none;box-shadow:0 0 0 3px rgba(169,121,64,0.12)"/>
    </div>
  </div>
  <div class="dim" style="font-size:11px;letter-spacing:0.04em;font-family:ui-monospace,monospace">bg #151515 · border α(0.24) · focus border #A97940 + glow 3px α(0.12)</div>
</div></body></html>
