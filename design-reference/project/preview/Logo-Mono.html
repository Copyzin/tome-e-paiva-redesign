<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Logo — Monochrome</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:0;gap:0">
  <div style="display:grid;grid-template-columns:1fr 1fr">
    <div style="background:#F2F0EC;padding:0;display:flex;align-items:center;justify-content:center;min-height:170px;overflow:hidden">
      <img src="../assets/stamp-mark-black.jpg" alt="black stamp mark on white" style="width:100%;height:100%;object-fit:cover;object-position:right center"/>
    </div>
    <div style="background:#111;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid rgba(169,121,64,0.18);border-left:none">
      <div class="eyebrow">Variante monocromática</div>
      <div style="font-family:'Montserrat';font-weight:200;font-size:18px;line-height:24px;letter-spacing:-0.01em">Preto sobre fundo claro.</div>
      <div class="dim" style="font-size:11.5px;line-height:18px">Usar em documentos impressos, papelaria de baixo custo, carimbo. Nunca em fundos coloridos saturados.</div>
    </div>
  </div>
</div></body></html>
