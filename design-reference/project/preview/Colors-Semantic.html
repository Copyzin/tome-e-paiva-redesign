<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Colors — Semantic</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Semânticas</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
    <div class="swatch"><div class="chip" style="background:#FFB4AB"></div><div class="name">Error</div><div class="hex">#FFB4AB</div></div>
    <div class="swatch"><div class="chip" style="background:#690005"></div><div class="name">On-error</div><div class="hex">#690005</div></div>
    <div class="swatch"><div class="chip" style="background:#8FB996"></div><div class="name">Success</div><div class="hex">#8FB996</div></div>
    <div class="swatch"><div class="chip" style="background:rgba(169,121,64,0.18);border-color:rgba(169,121,64,0.32)"></div><div class="name">Hairline</div><div class="hex">α(0.18)</div></div>
  </div>
  <div class="dim" style="font-size:11.5px;line-height:18px">Usar com moderação. Mensagens de erro/sucesso devem manter o vibe institucional — pouco saturadas, integradas ao dark theme.</div>
</div></body></html>
