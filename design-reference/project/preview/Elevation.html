<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Elevation</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Elevação · Camadas tonais</div>
  <div style="display:flex;gap:14px;align-items:stretch">
    <div style="flex:1;background:#0B0B0B;padding:14px;border:1px solid rgba(169,121,64,0.18);border-radius:4px">
      <div style="font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:#A97940;margin-bottom:8px">Nível 0</div>
      <div style="font-family:ui-monospace,monospace;font-size:10.5px;color:#9A958C">#0B0B0B<br/>page bg</div>
    </div>
    <div style="flex:1;background:#151515;padding:14px;border:1px solid rgba(169,121,64,0.22);border-radius:4px">
      <div style="font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:#A97940;margin-bottom:8px">Nível 1</div>
      <div style="font-family:ui-monospace,monospace;font-size:10.5px;color:#9A958C">#151515<br/>card low</div>
    </div>
    <div style="flex:1;background:#1C1C1C;padding:14px;border:1px solid rgba(169,121,64,0.32);border-radius:4px">
      <div style="font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:#A97940;margin-bottom:8px">Nível 2</div>
      <div style="font-family:ui-monospace,monospace;font-size:10.5px;color:#9A958C">#1C1C1C<br/>card hover</div>
    </div>
    <div style="flex:1;background:#252525;padding:14px;border:1px solid rgba(169,121,64,0.32);border-radius:4px;box-shadow:0 24px 64px -24px rgba(0,0,0,0.6)">
      <div style="font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:#A97940;margin-bottom:8px">Nível 3</div>
      <div style="font-family:ui-monospace,monospace;font-size:10.5px;color:#9A958C">#252525<br/>floating</div>
    </div>
  </div>
  <div class="dim" style="font-size:11px;line-height:17px">Profundidade vem de tom + borda dourada — sombras só em flutuantes (modal, navbar fixa). Nunca sombra cinza tipo Material.</div>
</div></body></html>
