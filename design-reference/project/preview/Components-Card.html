<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Components — Card</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Card · superfície padrão</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div style="background:#1C1C1C;border:1px solid rgba(169,121,64,0.22);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Montserrat';font-weight:600;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#A97940">01 · Trabalho</div>
      <div style="font-family:'Montserrat';font-weight:300;font-size:20px;line-height:26px;letter-spacing:-0.01em;color:#F2F0EC">Direito do Trabalho</div>
      <div style="font-family:'Montserrat';font-weight:400;font-size:13px;line-height:20px;color:#D8D2C8">Defesa de direitos trabalhistas e contencioso estratégico.</div>
    </div>
    <div style="background:#1C1C1C;border:1px solid rgba(169,121,64,0.45);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px;transform:translateY(-2px)">
      <div style="font-family:'Montserrat';font-weight:600;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#A97940">02 · Previdenciário</div>
      <div style="font-family:'Montserrat';font-weight:300;font-size:20px;line-height:26px;letter-spacing:-0.01em;color:#F2F0EC">Direito Previdenciário</div>
      <div style="font-family:'Montserrat';font-weight:400;font-size:13px;line-height:20px;color:#D8D2C8">Aposentadorias, benefícios e revisões junto ao INSS.</div>
    </div>
  </div>
  <div class="dim" style="font-size:10.5px;letter-spacing:0.04em;font-family:ui-monospace,monospace">bg #1C1C1C · border α(0.22) → hover α(0.45) + translateY(-2px)</div>
</div></body></html>
