<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Components — Buttons</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Botões · 3 variantes</div>
  <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
    <button style="font-family:'Montserrat';font-weight:500;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#111;background:#A97940;border:none;padding:14px 26px;border-radius:4px;cursor:pointer">Agendar reunião</button>
    <button style="font-family:'Montserrat';font-weight:500;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#A97940;background:transparent;border:1px solid #A97940;padding:13px 26px;border-radius:4px;cursor:pointer">Saiba mais</button>
    <button style="font-family:'Montserrat';font-weight:500;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#111;background:linear-gradient(-45deg, #A97940 0%, #C39150 48%, #E2C078 100%);border:none;padding:14px 26px;border-radius:2px;cursor:pointer">Consultoria Premium</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-family:ui-monospace,monospace;font-size:10.5px;color:#9A958C;letter-spacing:0.02em">
    <div>Primário — fill #A97940</div>
    <div>Secundário — outline #A97940</div>
    <div>Premium — gradient –45°</div>
  </div>
</div></body></html>
