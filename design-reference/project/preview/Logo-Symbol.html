<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Logo — Symbol Mark</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:0">
  <div style="background:#0B0B0B;padding:24px 28px;display:flex;align-items:center;justify-content:space-around;gap:24px;border:1px solid rgba(169,121,64,0.18)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <img src="../assets/logo-tome-paiva-gold.png" alt="symbol 32" style="height:32px"/>
      <div class="dim" style="font-size:10px;letter-spacing:0.08em">32 PX</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <img src="../assets/logo-tome-paiva-gold.png" alt="symbol 56" style="height:56px"/>
      <div class="dim" style="font-size:10px;letter-spacing:0.08em">56 PX</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <img src="../assets/logo-tome-paiva-gold.png" alt="symbol 96" style="height:96px"/>
      <div class="dim" style="font-size:10px;letter-spacing:0.08em">96 PX</div>
    </div>
    <div style="flex:1;max-width:200px;display:flex;flex-direction:column;gap:8px">
      <div class="eyebrow">Símbolo isolado</div>
      <div class="dim" style="font-size:12px;line-height:18px">Para favicons, watermarks e usos em escala reduzida onde o wordmark não cabe.</div>
    </div>
  </div>
</div></body></html>
