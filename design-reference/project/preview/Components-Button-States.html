<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Components — Button States</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Estados · Primário</div>
  <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <button style="font-family:'Montserrat';font-weight:500;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#111;background:#A97940;border:none;padding:12px 22px;border-radius:4px">Reunião</button>
      <div class="dim" style="font-size:10px;letter-spacing:0.06em">DEFAULT</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <button style="font-family:'Montserrat';font-weight:500;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#111;background:#C39150;border:none;padding:12px 22px;border-radius:4px">Reunião</button>
      <div class="dim" style="font-size:10px;letter-spacing:0.06em">HOVER</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <button style="font-family:'Montserrat';font-weight:500;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#F6E4C6;background:#7C5730;border:none;padding:12px 22px;border-radius:4px">Reunião</button>
      <div class="dim" style="font-size:10px;letter-spacing:0.06em">PRESSED</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <button style="font-family:'Montserrat';font-weight:500;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#9A958C;background:#252525;border:1px solid #303030;padding:11px 22px;border-radius:4px">Reunião</button>
      <div class="dim" style="font-size:10px;letter-spacing:0.06em">DISABLED</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <button style="font-family:'Montserrat';font-weight:500;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#A97940;background:rgba(169,121,64,0.08);border:1px solid #A97940;padding:11px 22px;border-radius:4px">Reunião</button>
      <div class="dim" style="font-size:10px;letter-spacing:0.06em">SEC. HOVER</div>
    </div>
  </div>
  <div class="dim" style="font-size:11px;line-height:17px">Transições 180–280ms ease-out. Sem elevação dramática nem bounce — apenas mudança tonal.</div>
</div></body></html>
