<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Spacing Scale</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Espaçamento · base 8pt</div>
  <div style="display:flex;align-items:flex-end;gap:14px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:4px;background:#A97940"></div><div class="dim" style="font-size:9.5px">4</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:8px;background:#A97940"></div><div class="dim" style="font-size:9.5px">8</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:12px;height:12px;background:#A97940"></div><div class="dim" style="font-size:9.5px">12</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:16px;background:#A97940"></div><div class="dim" style="font-size:9.5px">16</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:24px;background:#A97940"></div><div class="dim" style="font-size:9.5px">24</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:#A97940"></div><div class="dim" style="font-size:9.5px">32</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:48px;background:#A97940"></div><div class="dim" style="font-size:9.5px">48</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:#A97940"></div><div class="dim" style="font-size:9.5px">64</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:96px;height:96px;background:#A97940"></div><div class="dim" style="font-size:9.5px">96</div></div>
  </div>
  <div class="dim" style="font-size:11px;line-height:17px">Gutter 32 · Margens desktop 64 / tablet 40 / mobile 20 · Section gap 144 (vertical entre seções).</div>
</div></body></html>
