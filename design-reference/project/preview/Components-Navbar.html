<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Components — Navbar</title><link rel="stylesheet" href="_card.css">
<style>
  .tp-nav-preview {
    height: 64px;
    background: rgba(11,11,11,0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(169,121,64,0.18);
    display: flex; align-items: center;
    padding: 0 20px; gap: 18px;
    white-space: nowrap;
    position: relative;
  }
  .tp-nav-preview__brand { display: flex; align-items: center; gap: 9px; padding-right: 18px; }
  .tp-nav-preview__brand img { height: 26px; width: auto; }
  /* vertical hairline divider — gold, with soft fade top/bottom */
  .tp-nav-preview__divider {
    width: 1px; height: 28px;
    background: linear-gradient(180deg, transparent 0%, rgba(169,121,64,0.55) 50%, transparent 100%);
    flex-shrink: 0;
  }
  .tp-wordmark-mini {
    font-family: 'Montserrat', sans-serif;
    font-weight: 200; font-size: 10.5px;
    letter-spacing: 0.24em; color: #F2F0EC;
    display: inline-flex; align-items: baseline; gap: 0.45em;
    line-height: 1;
  }
  .tp-wordmark-mini .amp {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: 1em; color: #C39150;
    letter-spacing: 0; transform: translateY(-0.05em);
  }
  .tp-nav-preview__links {
    flex: 1;
    display: flex; gap: 22px;
    padding-left: 6px;
  }
  .tp-nav-preview__links a {
    font-family: 'Montserrat';
    font-weight: 500; font-size: 10.5px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: #F2F0EC; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 22px 0;
    position: relative;
  }
  .tp-nav-preview__links a.is-active { color: #A97940; }
  .tp-nav-preview__links a.has-dropdown svg { width: 10px; height: 10px; opacity: 0.6; }

  .tp-nav-preview__cta {
    font-family: 'Montserrat';
    font-weight: 500; font-size: 10.5px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: #111; background: #A97940;
    border: none; padding: 9px 16px; border-radius: 4px;
  }

  /* Dropdown — shown open in preview to demonstrate */
  .tp-dropdown {
    position: absolute; top: 100%; left: 0;
    background: #0F0F0F;
    border: 1px solid rgba(169,121,64,0.28);
    border-radius: 4px;
    padding: 8px 0;
    min-width: 240px;
    box-shadow: 0 24px 64px -24px rgba(0,0,0,0.7);
    z-index: 5;
  }
  .tp-dropdown::before {
    content: ''; position: absolute; top: -1px; left: 16px; width: 24px; height: 1px;
    background: linear-gradient(-45deg, #A97940 0%, #C39150 50%, #E2C078 100%);
  }
  .tp-dropdown a {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 10px 18px;
    font-family: 'Montserrat';
    font-weight: 400; font-size: 11.5px;
    letter-spacing: 0.04em; text-transform: none;
    color: #D8D2C8;
    text-decoration: none;
    transition: background 180ms, color 180ms;
  }
  .tp-dropdown a:hover { background: rgba(169,121,64,0.08); color: #F2F0EC; }
  .tp-dropdown .num {
    font-family: 'Montserrat';
    font-weight: 600; font-size: 9px;
    letter-spacing: 0.18em; color: #A97940;
  }
  .tp-dropdown__item--especialidades { position: relative; }
</style>
</head>
<body><div class="card" style="padding:0;background:#0B0B0B;overflow:visible">
  <div class="tp-nav-preview">
    <div class="tp-nav-preview__brand">
      <img src="../assets/logo-tome-paiva-gold.png" alt="" />
      <span class="tp-wordmark-mini">
        <span>TOMÉ</span>
        <span class="amp">&amp;</span>
        <span>PAIVA</span>
      </span>
    </div>
    <div class="tp-nav-preview__divider"></div>
    <nav class="tp-nav-preview__links">
      <a href="#">Escritório</a>
      <div class="tp-dropdown__item--especialidades">
        <a href="#" class="is-active has-dropdown">
          Especialidades
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </a>
        <div class="tp-dropdown">
          <a href="#"><span>Direito do Trabalho</span><span class="num">01</span></a>
          <a href="#"><span>Direito Previdenciário</span><span class="num">02</span></a>
          <a href="#"><span>Famílias e Sucessões</span><span class="num">03</span></a>
          <a href="#"><span>Direito Civil</span><span class="num">04</span></a>
          <a href="#"><span>Direito do Consumidor</span><span class="num">05</span></a>
        </div>
      </div>
      <a href="#">Equipe</a>
      <a href="#">Contato</a>
    </nav>
    <button class="tp-nav-preview__cta">Reunião</button>
  </div>
  <div style="padding:14px 22px;background:#111">
    <div class="dim" style="font-size:11px;line-height:17px;font-family:ui-monospace,monospace">Divisória vertical em ouro entre marca e links · dropdown abre em hover sobre "Especialidades" · acento dourado no topo do menu</div>
  </div>
</div></body></html>
